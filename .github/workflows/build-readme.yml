name: Build README
on:
  push:
    paths:
      - "components/**"
      - "build.sh"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - run: |
          git config user.name "github-actions"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: rebuild README"
          git push
